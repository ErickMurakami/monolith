[package]
name = "monolith"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A native Windows desktop companion"

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.9"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Foundation", "Media_Control", "Win32_System_WinRT"] }
windows-sys = { version = "0.61", features = [
  "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm",
  "Win32_Storage_Packaging_Appx", "Win32_System_Threading",
  "Win32_System_Power", "Win32_System_SystemInformation", "Win32_System_SystemServices",
  "Win32_System_Com", "Win32_Storage_FileSystem",
  "Win32_System_LibraryLoader", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Accessibility", "Win32_UI_Controls", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging",
] }
